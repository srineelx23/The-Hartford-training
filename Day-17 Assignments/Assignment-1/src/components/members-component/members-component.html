<div class="min-h-screen bg-gradient-to-br from-indigo-100 via-sky-100 to-purple-100 py-20">
  <div class="mx-auto max-w-5xl px-6 space-y-20">

    
    <div
      class="rounded-3xl border border-white/50
             bg-gradient-to-br from-white/90 to-indigo-100/80
             p-12 shadow-2xl backdrop-blur-md"
    >
      <h2 class="mb-10 text-2xl font-bold text-indigo-700">
        {{ isEditMode ? ' Update Member' : ' Add Member' }}
      </h2>

      <form (ngSubmit)="saveMember()" class="grid grid-cols-1 gap-8">

        
        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">
            Name
          </label>
          <input
            type="text"
            [(ngModel)]="member.name"
            name="name"
            required
            class="w-full rounded-xl border border-indigo-200
                   bg-white px-5 py-3 text-gray-900
                   focus:border-purple-500 focus:ring-2 focus:ring-purple-300
                   outline-none transition"
          />
        </div>

        
        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">
            Email
          </label>
          <input
            type="email"
            [(ngModel)]="member.email"
            name="email"
            required
            class="w-full rounded-xl border border-indigo-200
                   bg-white px-5 py-3 text-gray-900
                   focus:border-purple-500 focus:ring-2 focus:ring-purple-300
                   outline-none transition"
          />
        </div>

        
        <label class="flex items-center gap-4 text-sm font-medium text-gray-800">
          <input
            type="checkbox"
            [(ngModel)]="member.active"
            name="active"
            class="h-5 w-5 rounded border-indigo-300 text-indigo-600
                   focus:ring-indigo-400"
          />
          Active member
        </label>

      
        <div class="flex gap-6 pt-6">
          <button
            type="submit"
            class="rounded-full bg-gradient-to-r from-indigo-600 to-purple-600
                   px-12 py-3 text-sm font-bold text-white
                   shadow-xl hover:scale-[1.03] transition"
          >
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>

          <button
            type="button"
            (click)="resetForm()"
            class="rounded-full border border-indigo-300 bg-white
                   px-12 py-3 text-sm font-semibold text-indigo-700
                   hover:bg-indigo-50 transition"
          >
            Clear
          </button>
        </div>

      </form>
    </div>

    
    <div
      class="overflow-hidden rounded-3xl
             border border-white/50
             bg-gradient-to-br from-white/95 to-sky-100/80
             shadow-2xl backdrop-blur-md"
    >
      <table class="w-full border-collapse">

       
        <thead class="bg-gradient-to-r from-indigo-600 to-purple-600">
          <tr>
            <th class="px-8 py-5 text-left text-xs font-bold uppercase tracking-wider text-white">
              ID
            </th>
            <th class="px-8 py-5 text-left text-xs font-bold uppercase tracking-wider text-white">
              Name
            </th>
            <th class="px-8 py-5 text-left text-xs font-bold uppercase tracking-wider text-white">
              Email
            </th>
            <th class="px-8 py-5 text-left text-xs font-bold uppercase tracking-wider text-white">
              Status
            </th>
            <th class="px-8 py-5 text-left text-xs font-bold uppercase tracking-wider text-white">
              Actions
            </th>
          </tr>
        </thead>

     
        <tbody class="divide-y divide-indigo-100">
          @for (member of Members$ | async; track member.id) {
            <tr class="hover:bg-indigo-50/70 transition">

              <td class="px-8 py-4 font-medium text-gray-700">
                #{{ member.id }}
              </td>

              <td class="px-8 py-4 font-semibold text-gray-900">
                {{ member.name }}
              </td>

              <td class="px-8 py-4 text-gray-600">
                {{ member.email }}
              </td>

              <td class="px-8 py-4">
                <span
                  class="inline-flex rounded-full px-4 py-1
                         text-xs font-bold"
                  [ngClass]="member.active
                    ? 'bg-emerald-200 text-emerald-900'
                    : 'bg-rose-200 text-rose-900'"
                >
                  {{ member.active ? 'Active' : 'Inactive' }}
                </span>
              </td>

              <td class="px-8 py-4 flex gap-4">
                <button
                  (click)="editMember(member)"
                  class="rounded-full bg-indigo-100 px-5 py-1.5
                         text-sm font-bold text-indigo-700
                         hover:bg-indigo-200 transition"
                >
                  Edit
                </button>

                <button
                  (click)="deleteMember(member.id)"
                  class="rounded-full bg-rose-100 px-5 py-1.5
                         text-sm font-bold text-rose-700
                         hover:bg-rose-200 transition"
                >
                  Delete
                </button>
              </td>

            </tr>
          }
        </tbody>

      </table>
    </div>

  </div>
</div>
