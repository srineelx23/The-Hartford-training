<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    
    <h1 class="items-center text-center text-6xl">Tic Tac Toe Game</h1>
    <div class="select Player Choice flex justify-around mt-20 mb-10 items-center ">
        <h1 class="text-2xl">Player-1</h1>
        <select name="" id="" class="player1opt">
            <option value="x">✖️</option>
            <option value="o">⭕</option>
        </select>
        <h1 class="text-2xl">Player-2</h1>
        <select name="" id="" class="player2opt">
            <option value="x">✖️</option>
            <option value="o">⭕</option>
        </select>
    </div>
<div class="flex justify-center">
    <div class="game w-80 h-80">
        <div class="game-item game-item-1" onclick="boxSelected(1)"></div>
        <div class="game-item game-item-2" onclick="boxSelected(2)"></div>
        <div class="game-item game-item-3" onclick="boxSelected(3)"></div>
        <div class="game-item game-item-4" onclick="boxSelected(4)"></div>
        <div class="game-item game-item-5" onclick="boxSelected(5)"></div>
        <div class="game-item game-item-6" onclick="boxSelected(6)"></div>
        <div class="game-item game-item-7" onclick="boxSelected(7)"></div>
        <div class="game-item game-item-8" onclick="boxSelected(8)"></div>
        <div class="game-item game-item-9" onclick="boxSelected(9)"></div>
    </div>
    </div>
    <div class="resultdiv">
        <p class="result"></p>
        <button class="btn" onclick="reset()">New Game</button>
    </div>
    <script src="./script.js"></script>
</body>
</html>
