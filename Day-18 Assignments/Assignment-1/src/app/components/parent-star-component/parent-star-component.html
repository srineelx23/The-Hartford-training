<div class="min-h-screen bg-slate-100 p-8">
  <div class="mx-auto max-w-5xl grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

    @for (product of products; track product.id) {
      <div
        class="rounded-2xl bg-white p-6 shadow-lg border border-slate-200 flex flex-col justify-between"
      >
        <!-- Product Info -->
        <div>
          <h2 class="text-lg font-bold text-slate-900">
            {{ product.name }}
          </h2>

          <p class="mt-2 text-sm text-slate-600">
            {{ product.description }}
          </p>
        </div>

        <!-- Price + Rating -->
        <div class="mt-6 space-y-4">
          <span class="text-2xl font-extrabold text-emerald-600">
            ₹{{ product.price }}
          </span>

          <!-- Star Component -->
          <app-child-star-component
            (starSelected)="updateRating(product.id, $event)">
          </app-child-star-component>

          <!-- Rating Output -->
          <p class="text-sm text-slate-700">
            Rating:
            <span class="font-bold text-amber-500">
              {{ product.rating }}
            </span>/5
          </p>
        </div>
      </div>
    }

  </div>
</div>
