<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance Management System</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <div class="form-container">
    <h2>Add Customer</h2>

    <form id="policyForm">

      <div class="form-group">
        <label>Policy Number</label>
        <input type="text" id="policyNumber" required />
      </div>

      <div class="form-group">
        <label>Policy Holder</label>
        <input type="text" id="policyHolder" required />
      </div>

      <div class="form-group">
        <label>Policy Type</label>
        <select id="policyType">
          <option>Health</option>
          <option>Life</option>
          <option>Vehicle</option>
          <option>Travel</option>
        </select>
      </div>

      <div class="form-group">
        <label>Premium</label>
        <input type="number" id="premium" required />
      </div>

      <div class="form-group">
        <label>Duration</label>
        <input type="text" id="duration" placeholder="1 Year" required />
      </div>

      <div class="form-group">
        <label>Coverage Amount</label>
        <input type="number" id="coverageAmount" required />
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="statusApp">
          <option>Active</option>
          <option>Expired</option>
        </select>
      </div>

      <div class="form-group">
        <label>Start Date</label>
        <input type="date" id="startDate" required />
      </div>

      <button type="button" onclick="addelement()">Add Policy</button>
      <p id="message" class="message"></p>

    </form>
  </div>

  <div class="resultdiv"></div>

  <script src="./script.js"></script>
</body>
</html>
