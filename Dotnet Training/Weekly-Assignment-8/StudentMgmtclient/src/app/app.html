<router-outlet></router-outlet>

<!-- Global Notification System -->
@if (notification()) {
<div class="fixed top-6 right-6 z-[9999] animate-in fade-in slide-in-from-top-4 duration-300">
    <div [class]="notification()?.type === 'error' ? 'bg-red-500 shadow-red-500/20' : notification()?.type === 'success' ? 'bg-emerald-500 shadow-emerald-500/20' : 'bg-blue-500 shadow-blue-500/20'"
        class="flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl border border-white/20 backdrop-blur-md min-w-[320px]">

        <!-- Icon -->
        <div class="flex-shrink-0">
            @if (notification()?.type === 'error') {
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            } @else if (notification()?.type === 'success') {
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            } @else {
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            }
        </div>

        <!-- Content -->
        <div class="flex-1">
            <p class="text-white font-bold text-sm tracking-wide leading-tight">
                {{ notification()?.message }}
            </p>
        </div>

        <!-- Close -->
        <button (click)="notificationService.clear()" class="p-1 hover:bg-white/10 rounded-lg transition-colors">
            <svg class="w-5 h-5 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
</div>
}
