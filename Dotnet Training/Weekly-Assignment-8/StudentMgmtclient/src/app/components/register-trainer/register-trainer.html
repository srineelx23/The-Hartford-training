<div class="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Background Elements -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-0 -right-1/4 w-full h-full bg-purple-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-0 -left-1/4 w-full h-full bg-pink-600/20 rounded-full blur-[120px]"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <!-- Back Button -->
        <a routerLink="/"
            class="inline-flex items-center text-purple-400 hover:text-purple-300 transition-colors mb-6 text-sm font-semibold group">
            <span class="mr-2 group-hover:-translate-x-1 transition-transform">&larr;</span> Back to Home
        </a>

        <!-- Form Container -->
        <div class="bg-white/10 backdrop-blur-2xl border border-white/10 p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-400 to-pink-500 flex items-center justify-center mx-auto mb-4 text-white shadow-lg shadow-purple-500/30">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5a2.5 2.5 0 00-2.5-2.5H14">
                        </path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-white">Trainer Registration</h2>
                <p class="text-slate-400 mt-2 text-sm">Become an educator on EduManage.</p>
            </div>

            <form (ngSubmit)="register()" #registerForm="ngForm" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">First Name</label>
                        <input type="text" name="firstName" [(ngModel)]="trainer.firstName"
                            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all text-white placeholder-slate-500"
                            placeholder="Jane" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Last Name</label>
                        <input type="text" name="lastName" [(ngModel)]="trainer.lastName"
                            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all text-white placeholder-slate-500"
                            placeholder="Smith" required>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Email Address</label>
                    <input type="email" name="email" [(ngModel)]="trainer.email"
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all text-white placeholder-slate-500"
                        placeholder="jane.smith@example.com" required>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Gender</label>
                    <select name="gender" [(ngModel)]="trainer.gender"
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all text-white appearance-none"
                        required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                    <input type="password" name="password" [(ngModel)]="trainer.password"
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-all text-white placeholder-slate-500"
                        placeholder="••••••••" required>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 text-white rounded-xl font-bold shadow-lg shadow-purple-500/25 transition-all transform hover:-translate-y-0.5 mt-6">
                    Create Trainer Account
                </button>
            </form>

            <p class="text-center mt-6 text-sm text-slate-400">
                Already have an account? <a routerLink="/login"
                    class="text-purple-400 hover:text-purple-300 font-semibold transition-colors">Log in</a>
            </p>
        </div>
    </div>
</div>
