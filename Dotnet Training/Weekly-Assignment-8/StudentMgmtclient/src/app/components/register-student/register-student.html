<div class="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Background Elements -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-0 -left-1/4 w-full h-full bg-cyan-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-0 -right-1/4 w-full h-full bg-blue-600/20 rounded-full blur-[120px]"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <!-- Back Button -->
        <a routerLink="/"
            class="inline-flex items-center text-cyan-400 hover:text-cyan-300 transition-colors mb-6 text-sm font-semibold group">
            <span class="mr-2 group-hover:-translate-x-1 transition-transform">&larr;</span> Back to Home
        </a>

        <!-- Form Container -->
        <div class="bg-white/10 backdrop-blur-2xl border border-white/10 p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-400 to-blue-500 flex items-center justify-center mx-auto mb-4 text-white shadow-lg shadow-cyan-500/30">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z">
                        </path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-white">Student Registration</h2>
                <p class="text-slate-400 mt-2 text-sm">Join the platform to start learning.</p>
            </div>

            <form (ngSubmit)="register()" #registerForm="ngForm" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">First Name</label>
                        <input type="text" name="firstName" [(ngModel)]="student.firstName"
                            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all text-white placeholder-slate-500"
                            placeholder="John" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Last Name</label>
                        <input type="text" name="lastName" [(ngModel)]="student.lastName"
                            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all text-white placeholder-slate-500"
                            placeholder="Doe" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Age</label>
                        <input type="number" name="age" [(ngModel)]="student.age"
                            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all text-white placeholder-slate-500"
                            placeholder="18" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Gender</label>
                        <select name="gender" [(ngModel)]="student.gender"
                            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all text-white appearance-none"
                            required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Email Address</label>
                    <input type="email" name="email" [(ngModel)]="student.email"
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all text-white placeholder-slate-500"
                        placeholder="john@example.com" required>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                    <input type="password" name="password" [(ngModel)]="student.password"
                        class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all text-white placeholder-slate-500"
                        placeholder="••••••••" required>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-white rounded-xl font-bold shadow-lg shadow-cyan-500/25 transition-all transform hover:-translate-y-0.5 mt-6">
                    Create Account
                </button>
            </form>

            <p class="text-center mt-6 text-sm text-slate-400">
                Already have an account? <a routerLink="/login"
                    class="text-cyan-400 hover:text-cyan-300 font-semibold transition-colors">Log in</a>
            </p>
        </div>
    </div>
</div>
