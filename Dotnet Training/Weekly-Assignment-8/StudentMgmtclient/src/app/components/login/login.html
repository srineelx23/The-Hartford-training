<div class="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Background Elements -->
    <div class="absolute inset-0 z-0 flex items-center justify-center">
        <div class="w-[800px] h-[800px] bg-indigo-600/10 rounded-full blur-[120px]"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <!-- Back Button -->
        <a routerLink="/"
            class="inline-flex items-center text-indigo-400 hover:text-indigo-300 transition-colors mb-6 text-sm font-semibold group">
            <span class="mr-2 group-hover:-translate-x-1 transition-transform">&larr;</span> Back to Home
        </a>

        <!-- Form Container -->
        <div class="bg-white/10 backdrop-blur-2xl border border-white/10 p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-blue-500 flex items-center justify-center mx-auto mb-4 text-white shadow-lg shadow-indigo-500/30">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1">
                        </path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-white">Welcome Back</h2>
                <p class="text-slate-400 mt-2 text-sm">Sign in to your account.</p>
            </div>

            <form (ngSubmit)="login()" #loginForm="ngForm" class="space-y-5">
                <!-- Role Selection Toggle -->
                <div class="space-y-3">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">I am a</label>
                    <div
                        class="flex relative bg-slate-800/50 p-1.5 rounded-xl border border-slate-700 w-full overflow-hidden">
                        <!-- Sliding Indicator -->
                        <div class="absolute inset-y-1.5 left-1.5 w-[calc(50%-6px)] bg-gradient-to-r from-indigo-500 to-blue-500 rounded-lg transition-transform duration-300 ease-in-out shadow-lg"
                            [class.translate-x-0]="role === 'Student'" [class.translate-x-full]="role === 'Trainer'">
                        </div>

                        <!-- Buttons -->
                        <button type="button" (click)="role = 'Student'"
                            class="relative z-10 w-1/2 py-2.5 text-sm font-semibold transition-colors duration-300 rounded-lg"
                            [class.text-white]="role === 'Student'" [class.text-slate-400]="role !== 'Student'"
                            [class.hover:text-slate-200]="role !== 'Student'">
                            Student
                        </button>
                        <button type="button" (click)="role = 'Trainer'"
                            class="relative z-10 w-1/2 py-2.5 text-sm font-semibold transition-colors duration-300 rounded-lg"
                            [class.text-white]="role === 'Trainer'" [class.text-slate-400]="role !== 'Trainer'"
                            [class.hover:text-slate-200]="role !== 'Trainer'">
                            Trainer
                        </button>
                    </div>
                </div>

                <!-- Fields -->
                <div class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Email
                            Address</label>
                        <input type="email" name="email" [(ngModel)]="credentials.email"
                            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-white placeholder-slate-500"
                            placeholder="you@example.com" required>
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between items-center">
                            <label
                                class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                            <a href="#" class="text-xs text-indigo-400 hover:text-indigo-300">Forgot?</a>
                        </div>
                        <input type="password" name="password" [(ngModel)]="credentials.password"
                            class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-white placeholder-slate-500"
                            placeholder="••••••••" required>
                    </div>

                    <!-- CAPTCHA Section -->
                    <div class="space-y-3 p-4 bg-slate-800/30 rounded-2xl border border-white/5">
                        <div class="flex justify-between items-center">
                            <label
                                class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Verification</label>
                            <button type="button" (click)="refreshCaptcha()"
                                class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition-colors">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                    </path>
                                </svg>
                                Refresh
                            </button>
                        </div>
                        <div class="flex gap-2 items-center">
                            <div
                                class="flex-shrink-0 px-3 py-2 bg-gradient-to-br from-slate-700 to-slate-800 rounded-xl border border-slate-600 flex items-center justify-center min-w-[85px] select-none shadow-inner">
                                <span
                                    class="text-lg font-black tracking-[0.2em] text-indigo-400 italic font-mono drop-shadow-[0_0_8px_rgba(129,140,248,0.5)]">
                                    {{ captchaCode() }}
                                </span>
                            </div>
                            <input type="text" name="captcha" [(ngModel)]="captchaInput" autocomplete="off"
                                class="flex-1 min-w-0 px-3 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-white placeholder-slate-500 text-center font-bold tracking-widest uppercase"
                                placeholder="Code" required>
                        </div>
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-blue-500 hover:from-indigo-400 hover:to-blue-400 text-white rounded-xl font-bold shadow-lg shadow-indigo-500/25 transition-all transform hover:-translate-y-0.5 mt-6 disabled:opacity-50 disabled:cursor-not-allowed">
                    Sign In
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <p class="text-sm text-slate-400 mb-4">Don't have an account?</p>
                <div class="flex justify-center flex-wrap gap-4">
                    <a routerLink="/register-student"
                        class="text-sm font-semibold text-cyan-400 hover:text-cyan-300 transition-colors">Register
                        Student</a>
                    <span class="text-slate-600 hidden sm:inline">|</span>
                    <a routerLink="/register-trainer"
                        class="text-sm font-semibold text-purple-400 hover:text-purple-300 transition-colors">Register
                        Trainer</a>
                </div>
            </div>
        </div>
    </div>
</div>
