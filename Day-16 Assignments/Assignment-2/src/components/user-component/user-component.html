<h2 class="text-2xl font-bold mb-6 text-slate-800 text-center">
  My Basic CRUD Operations
</h2>

<!-- FORM CARD -->
<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md mb-10">

  <h3 class="text-lg font-semibold mb-4 text-slate-700">
    {{ isEditMode ? 'Update User' : 'Add User' }}
  </h3>

  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">
        Name
      </label>
      <input
        type="text"
        [(ngModel)]="user.name"
        placeholder="Enter name"
        class="w-full px-3 py-2 border rounded-md focus:outline-none
               focus:ring-2 focus:ring-teal-500 focus:border-teal-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">
        Email
      </label>
      <input
        type="email"
        [(ngModel)]="user.email"
        placeholder="Enter email"
        class="w-full px-3 py-2 border rounded-md focus:outline-none
               focus:ring-2 focus:ring-teal-500 focus:border-teal-500" />
    </div>

    <button
      (click)="saveUser()"
      class="w-full py-2 rounded-md text-white font-semibold
             bg-teal-600 hover:bg-teal-700 transition">
      {{ isEditMode ? 'Update User' : 'Add User' }}
    </button>
  </div>
</div>

<!-- TABLE CARD -->
<div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">

  <table class="w-full text-left border-collapse">
    <thead class="bg-slate-100">
      <tr>
        <th class="px-4 py-3 text-sm font-semibold text-slate-600">Name</th>
        <th class="px-4 py-3 text-sm font-semibold text-slate-600">Email</th>
        <th class="px-4 py-3 text-sm font-semibold text-slate-600 text-center">
          Actions
        </th>
      </tr>
    </thead>

    <tbody>
      @for (u of users; track $index) {
        <tr class="border-t hover:bg-slate-50 transition">
          <td class="px-4 py-3 text-slate-700 font-medium">
            {{ u.name }}
          </td>
          <td class="px-4 py-3 text-slate-600">
            {{ u.email }}
          </td>
          <td class="px-4 py-3 flex justify-center gap-3">

            <button
              (click)="editUser(u)"
              class="px-3 py-1 text-sm rounded-md
                     bg-blue-100 text-blue-700 hover:bg-blue-200 transition">
              Edit
            </button>

            <button
              (click)="deleteUser(u.id)"
              class="px-3 py-1 text-sm rounded-md
                     bg-red-100 text-red-700 hover:bg-red-200 transition">
              Delete
            </button>

          </td>
        </tr>
      }
    </tbody>
  </table>

</div>
