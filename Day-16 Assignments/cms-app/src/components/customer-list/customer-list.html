<div class="p-6">
 <h2 class="text-2xl font-bold mb-6 text-gray-700">Customer
List</h2>
 <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap6">
 @for (customer of customers; track $index) { 
    <div class="bg-white shadow-lg rounded-xl p-5 border
hover:shadow-xl transition">
 <h3 class="text-xl font-semibold text-blue-600 mb-2">
 {{ customer.name }}
 </h3>
 <p class="text-gray-600">📧 {{ customer.email }}</p>
 <p class="text-gray-600">📞 {{ customer.phone }}</p>
 <p class="text-gray-500 mt-2">📍 {{ customer.city }}</p>
 </div>
 }
 </div>
</div>
